<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rusbé restaurante</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- CABEÇALHO-->
    <header class="faixa">
      <h1 class="T1">RESTAURANTE<br />RUSBÉ</h1>

      <div class="links">
        <a href="#cardapio">Cardápio</a>
        <a href="#reservas">Reservas</a>
        <a href="#sobre">Sobre</a>
        <a href="#contatos">Contatos</a>
      </div>
    </header>
    <h2 class="h2centro">MAIS PEDIDOS</h2>
    <section class="main">
      <div class="principaisp1">
        Baião de dois
        <img src="assets/baiao-de-dois.jpg" alt="Baião de dois" />
      </div>
      <div class="principaisp2">
        Tacacá
        <img src="assets/tacaca-paraense.jpeg" alt="Tacacá" />
      </div>
      <div class="principaisp3">
        Fígado com Jiló
        <img src="assets/figado-jilo.jpg" alt="Fígado com Jiló" />
      </div>
      <div class="principaisp4">
        Camarão
        <img src="assets/camarao-frito.jpg" alt="Camarão" />
      </div>
    </section>
    <h2 class="h2centro">CARDÁPIO</h2>
    <section id="cardapio" class="pratos">
      <p>Bauru</p>
      <p>KAOL</p>
      <p>Arroz carreteiros</p>
      <p>Bobó de Camarão</p>
      <p>Moqueca</p>
      <p>Barreado</p>
      <p>Feijoada Completa</p>
      <p>Empadão Goiano</p>
      <p>Arroz com Pequi</p>
    </section>
    <h2 id="reservas" class="reserva">RESERVAS</h2>
    <section class="formulariosR">
      <form action="/enviar-dados" method="post">
        <label for="nome">Nome:</label>
        <input
          type="text"
          placeholder="Ex: Lucas Vasconcelos"
          id="nome"
          name="nome"
          required />
        <br /><br />
        <label for="email">E-mail:</label>
        <input
          type="email"
          placeholder="Ex: 1s2wF@email.com"
          id="email"
          name="email"
          required />
        <br /><br />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </body>

  <script src="scripts.js"></script>
</html>
